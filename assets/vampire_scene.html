<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;padding:0;margin:0;overflow:hidden;background:#0b0d14;color:#fff;font-family:Inter,Segoe UI,Arial,sans-serif}
.scene{width:100%;height:100%;position:relative;overflow:hidden;isolation:isolate;border:1px solid rgba(222,190,234,.16);border-radius:22px;background:#171223;box-shadow:inset 0 0 80px rgba(1,0,9,.45)}
.photo{width:100%;height:100%;object-fit:cover;object-position:50% 36%;display:block;position:absolute;inset:0;will-change:transform;transition:filter .2s ease;filter:saturate(1.08) contrast(1.03)}
.scene:before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(8,9,19,.54) 0%,rgba(8,9,19,0) 19%,rgba(11,8,18,0) 57%,rgba(6,6,14,.94) 100%),linear-gradient(90deg,rgba(9,9,18,.25),transparent 42%,rgba(11,7,17,.10));}
.scene:after{content:"";position:absolute;inset:0;z-index:7;pointer-events:none;border-radius:22px;box-shadow:inset 0 0 70px rgba(0,0,0,.42),inset 0 0 0 1px rgba(255,255,255,.08)}
.gaze{position:absolute;z-index:4;pointer-events:none;transform:translate(-50%,-50%);width:15px;height:15px;border-radius:50%;background:radial-gradient(ellipse at 42% 40%,#1a0007 0%,#48030d 33%,#b71330 59%,rgba(255,25,75,0) 82%);mix-blend-mode:screen;opacity:.89;filter:blur(.4px) drop-shadow(0 0 3px rgba(241,28,63,.35));will-change:transform,left,top}
.gaze:after{content:"";position:absolute;width:2px;height:2px;border-radius:50%;background:#ffece0;left:31%;top:21%;opacity:.7}
.spec{position:absolute;z-index:5;pointer-events:none;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(166,56,100,.05),transparent 60%);mix-blend-mode:screen}
.bottom{position:absolute;z-index:8;left:19px;right:19px;bottom:16px;display:flex;flex-direction:column;gap:13px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.stat{background:rgba(23,22,36,.76);border:1px solid rgba(230,214,247,.17);border-radius:11px;padding:9px 11px;backdrop-filter:blur(14px);min-width:0}
.stat strong{display:block;font-size:16px;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.stat small{display:block;font-size:10px;color:#bfb3cf;margin-top:2px}
@media(max-width:370px){.bottom{left:11px;right:11px;bottom:11px}.stat{padding:8px 7px}.stat strong{font-size:14px}}
@media(prefers-reduced-motion:reduce){.photo,.gaze{transition:none!important}}
</style>
</head>
<body>
<div id="scene" class="scene" aria-label="Portrait cinématographique d'un vampire, dont les yeux suivent le curseur">
  <img id="portrait" class="photo" src="data:image/webp;base64,__PORTRAIT_DATA__" alt="Portrait réaliste d'un vampire aux yeux rouges dans un château gothique">
  <div id="left-eye" class="gaze" aria-hidden="true"></div>
  <div id="right-eye" class="gaze" aria-hidden="true"></div>
  <div class="spec"></div>
  <div class="bottom">
    <div class="stats">
      <div class="stat"><strong>__HUMANS__</strong><small>Humains</small></div>
      <div class="stat"><strong>__VAMPIRES__</strong><small>Vampires</small></div>
      <div class="stat"><strong>__PROXIMITY__&nbsp;%</strong><small>Proximité</small></div>
    </div>
  </div>
</div>
<script>
(()=>{
  'use strict';
  const root=document.getElementById('scene');
  const photo=document.getElementById('portrait');
  const eyes=[document.getElementById('left-eye'),document.getElementById('right-eye')];
  const anchors=[[143,312],[240,281]];
  const IMAGE_W=530, IMAGE_H=830;
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let targetX=0,targetY=0,actualX=0,actualY=0;
  function layoutEyes(){
    const width=root.clientWidth,height=root.clientHeight;
    const scale=Math.max(width/IMAGE_W,height/IMAGE_H);
    const offsetX=(width-IMAGE_W*scale)*0.5;
    const offsetY=(height-IMAGE_H*scale)*0.36;
    anchors.forEach((pos,i)=>{
      eyes[i].style.left=(offsetX+pos[0]*scale)+'px';
      eyes[i].style.top=(offsetY+pos[1]*scale)+'px';
    });
  }
  function follow(x,y){
    const box=root.getBoundingClientRect();
    targetX=Math.max(-1,Math.min(1,(x-(box.left+box.width/2))/(box.width*.65)));
    targetY=Math.max(-1,Math.min(1,(y-(box.top+box.height/2))/(box.height*.65)));
  }
  root.addEventListener('pointermove',e=>follow(e.clientX,e.clientY),{passive:true});
  root.addEventListener('pointerleave',()=>{targetX=0;targetY=0},{passive:true});
  try {
    const externalFrame=window.frameElement;
    if(externalFrame && window.parent && window.parent.document){
      window.parent.document.addEventListener('pointermove',e=>{
        const rect=externalFrame.getBoundingClientRect();
        follow(e.clientX-rect.left,e.clientY-rect.top);
      },{passive:true});
    }
  }catch(_err){/* La souris reste suivie à l'intérieur de la scène. */}
  function tick(){
    if(!reduceMotion){
      actualX+=(targetX-actualX)*.11;
      actualY+=(targetY-actualY)*.11;
      eyes.forEach((eye,i)=>{
        const dx=actualX*(i===0?5.0:4.5),dy=actualY*3.4;
        eye.style.transform='translate(calc(-50% + '+dx.toFixed(2)+'px),calc(-50% + '+dy.toFixed(2)+'px))';
      });
      photo.style.transform='translate('+(-actualX*2.2).toFixed(2)+'px,'+(-actualY*1.6).toFixed(2)+'px) scale(1.014)';
    }
    window.requestAnimationFrame(tick);
  }
  layoutEyes();
  new ResizeObserver(layoutEyes).observe(root);
  if(photo.complete)layoutEyes();else photo.addEventListener('load',layoutEyes,{once:true});
  if(!reduceMotion)window.requestAnimationFrame(tick);
})();
</script>
</body>
</html>

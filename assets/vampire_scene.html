<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b13;font-family:Inter,'Segoe UI',system-ui,sans-serif;color:white}
.stage{position:relative;width:100%;height:430px;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse 85% 65% at 62% 31%,#33243e 0%,#14172b 55%,#0b101f 80%,#080c16 100%);border:1px solid rgba(236,196,234,.16);border-radius:24px;box-shadow:inset 0 0 45px rgba(0,0,0,.38)}
.stage:before{position:absolute;content:'';inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at 58% 38%,transparent 28%,rgba(4,5,13,.25) 72%,rgba(4,5,13,.71) 100%)}
.glow{position:absolute;width:325px;height:325px;border-radius:50%;right:12%;top:8%;background:radial-gradient(circle,rgba(205,90,128,.15),rgba(97,65,160,.11) 39%,transparent 71%);filter:blur(18px);animation:pulse 7s ease-in-out infinite}
.hud{position:absolute;inset:21px 25px auto 25px;z-index:6;pointer-events:none;max-width:45%}.eyebrow{font-weight:800;color:#ec96ac;letter-spacing:.21em;font-size:10px}.headline{font-weight:760;font-size:clamp(16px,2.2vw,19px);line-height:1.25;letter-spacing:-.03em;margin-top:8px;color:#f9f3f8}.subtitle{margin-top:8px;font-size:11px;color:#c8bece;line-height:1.5;max-width:200px}
.art{position:absolute;width:100%;height:100%;inset:0;object-fit:contain;transform:translate3d(0,0,0);overflow:visible;pointer-events:none}.portrait{filter:drop-shadow(0 9px 24px rgba(0,0,0,.6))}.head{transform-box:fill-box;transform-origin:center 71%;transition:transform .35s ease-out}.eyes .iris{transition:transform .1s ease-out;transform-box:fill-box;transform-origin:center}.foreground{position:absolute;z-index:7;inset:auto 13px 12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.stat{background:linear-gradient(145deg,rgba(42,40,66,.89),rgba(18,22,38,.92));border:1px solid rgba(229,215,253,.15);border-radius:12px;padding:9px 9px 8px;box-shadow:0 6px 16px rgba(0,0,0,.18);backdrop-filter:blur(8px)}.stat strong{display:block;font-variant-numeric:tabular-nums;font-size:15px;font-weight:800;line-height:1.1;color:#fff}.stat small{display:block;color:#aaa6bd;font-size:9px;margin-top:5px;line-height:1.22}
.vignette{position:absolute;z-index:4;bottom:0;left:0;right:0;height:95px;background:linear-gradient(0deg,rgba(9,9,22,.92),transparent);pointer-events:none}.spark{position:absolute;z-index:2;width:2px;height:2px;border-radius:100%;background:#ffe0e9;box-shadow:0 0 11px 3px rgba(236,124,169,.22);animation:float 7s infinite alternate ease-in-out;pointer-events:none}.spark:nth-of-type(2){left:76%;top:16%;animation-delay:-3s}.spark:nth-of-type(3){left:42%;top:69%;animation-delay:-4s}.spark:nth-of-type(4){left:88%;top:64%;animation-delay:-2s}
@keyframes float{from{opacity:.3;transform:translateY(7px)}to{opacity:.95;transform:translateY(-18px)}}@keyframes pulse{50%{opacity:.65;transform:scale(1.12)}}
@media(prefers-reduced-motion:reduce){.spark,.glow{animation:none}.head,.iris{transition:none}}
@media(max-width:480px){.hud{max-width:46%;left:15px;top:16px}.headline{font-size:15px}.subtitle{font-size:10px}.stat{padding:8px 7px}.stat strong{font-size:13px}.stat small{font-size:8px}}
</style>
</head><body>

<div class="vignette"></div>
<div class="foreground"><div class="stat"><strong id="humans">0</strong><small>Humains</small></div><div class="stat"><strong id="vampires">0</strong><small>Vampires</small></div><div class="stat"><strong id="proximity">0 %</strong><small>Proximité</small></div></div>
</main>
<script>
(function(){
  'use strict';
  const scene=document.getElementById('stage');
  const head=document.getElementById('head');
  const portrait=document.getElementById('portrait');
  const pupils=[document.getElementById('irisL'),document.getElementById('irisR')];
  const human=Number('__HUMANS__'),vampire=Number('__VAMPIRES__'),proximity=Number('__PROXIMITY__');
  const fmt=new Intl.NumberFormat('fr-FR');
  document.getElementById('humans').textContent=fmt.format(human);
  document.getElementById('vampires').textContent=fmt.format(vampire);
  document.getElementById('proximity').textContent=fmt.format(proximity)+' %';
  let targetX=0,targetY=0,x=0,y=0,frame=0;
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const updatePointer=(event)=>{
    const r=scene.getBoundingClientRect();
    targetX=Math.max(-1,Math.min(1,(event.clientX-r.left-r.width*.65)/(r.width*.40)));
    targetY=Math.max(-1,Math.min(1,(event.clientY-r.top-r.height*.44)/(r.height*.42)));
  };
  scene.addEventListener('pointermove',updatePointer,{passive:true});
  scene.addEventListener('pointerleave',()=>{targetX=0;targetY=0},{passive:true});
  const tick=()=>{
    x+=(targetX-x)*.12;y+=(targetY-y)*.12;
    const irisTransform='translate('+(x*4.6).toFixed(2)+'px,'+(y*2.9).toFixed(2)+'px)';
    pupils.forEach(iris=>{iris.style.transform=irisTransform});
    if(!reduceMotion){
      const hx=x*1.4,hy=y*1.0;
      head.style.transform='translate('+hx.toFixed(2)+'px,'+hy.toFixed(2)+'px) rotate('+(x*.6).toFixed(2)+'deg)';
      portrait.style.transform='translate('+(-x*.95).toFixed(2)+'px,'+(-y*.55).toFixed(2)+'px)';
    }
    frame=requestAnimationFrame(tick);
  };
  frame=requestAnimationFrame(tick);
  window.addEventListener('pagehide',()=>cancelAnimationFrame(frame),{once:true});
})();
</script>
</body></html>
